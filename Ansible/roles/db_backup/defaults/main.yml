---
db_container_name: postgres_db
db_admin_user: "{{ db_user | default('petclinic') }}"
app_db_name: "{{ db_name | default('petclinic') }}"
backup_dir: /var/backups/postgresql
backup_retention_days: 7

backup_script_path: /usr/local/sbin/pg_backup.sh
restore_script_path: /usr/local/sbin/pg_restore.sh

backup_cron_minute: "0"
backup_cron_hour: "2"
