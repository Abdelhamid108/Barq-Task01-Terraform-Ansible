---
- name: Ensure App stack directory exists
  ansible.builtin.file:
    path: "{{ app_stack_dir }}"
    state: directory
    mode: '0755'

- name: Template Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ app_stack_dir }}/nginx.conf"
    mode: '0644'

- name: Template App docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_stack_dir }}/docker-compose.yml"
    mode: '0644'

- name: Template .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ app_stack_dir }}/.env"
    mode: '0600'
  no_log: true


- name: Deploy App stack using Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_stack_dir }}"
    state: present