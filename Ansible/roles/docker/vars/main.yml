# Docker role variables that should not normally be overridden belong here.
# roles/docker/vars/main.yml
---

# Official Docker packages to install
docker_packages:
  - "docker-{{ docker_edition }}"
  - "docker-{{ docker_edition }}-cli"
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Official GPG Key and Repo URLs (using Ansible facts for dynamic OS detection)
docker_gpg_key_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
docker_keyring_path: "/etc/apt/keyrings/docker.asc"
docker_repo_url: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} {{ docker_apt_release_channel }}"
