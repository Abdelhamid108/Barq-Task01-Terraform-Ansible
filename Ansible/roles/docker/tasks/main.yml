---

- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

# Install prerequisite packages for Docker repo and shared tooling
- name: Install prerequisite packages and Git
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true

# Create directory for storing GPG keys securely
- name: Create directory for Docker GPG keyrings (Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# Download Docker's official GPG key
- name: Download the Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: "{{ docker_keyring_path }}"
    mode: "0644"

# Add Docker repository to apt sources
- name: Add the Docker repository to Apt sources
  ansible.builtin.apt_repository:
    repo: "{{ docker_repo_url }}"
    filename: docker
    state: present
    update_cache: true

# Install Docker Engine and related plugins
- name: install docker engine
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: "{{ docker_package_state }}"
  notify: docker start and enable


# Add the current ansible user to the 'docker' group
# This allows running docker commands without 'sudo'
- name: add ansible user for Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
